<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriciOS">
<meta name="theme-color" content="#161618">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png">
<title>NutriciOS</title>
<style>
:root{--bg:#161618;--card:#2a2a2d;--ink:#f5f5f7;--mute:#a1a1a8;--line:#3c3c40;--acc:#e8f34c;--acc2:#2f3214;--warn:#f5b84a;--warn2:#3a2c14;--bad:#ff6b6b;--r:20px;--ink-on-acc:#111;--p:#d45fd2;--c:#9fd043;--f:#57c0ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,-apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:34px;margin:10px 0 4px;letter-spacing:.01em}h2,.big,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.02em}h2{font-size:15px;margin:22px 0 8px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}h3{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.hi{border-color:var(--acc);background:var(--acc2)}.card.hi b{color:var(--acc)}.wn{border-color:var(--warn);background:var(--warn2)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;min-height:40px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--ink-on-acc);font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px}
button.s{padding:6px 10px;min-height:34px;font-size:14px}
button:active{opacity:.7}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
input[type=number]{text-align:right}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 4px}
.meal{display:flex;gap:12px;align-items:flex-start}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;flex:none;font-weight:800;color:var(--ink-on-acc);background:var(--acc)}
.chk.off{background:transparent;color:var(--mute);border-color:var(--line)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--acc);border-color:var(--acc)}.tag.w{color:var(--warn);border-color:var(--warn)}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(42,42,45,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:99px;display:flex;padding:6px;max-width:620px;margin:0 auto}
nav button{flex:1;border:0;background:none;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border-radius:99px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--acc);font-weight:600;background:#3a3a3e}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border-radius:99px;padding:6px 12px;min-height:34px;font-size:14px}.chips button.on{background:var(--acc);color:var(--ink-on-acc);border-color:var(--acc)}
.items .it{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:6px 0}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}.mbox{background:var(--card);border:1px solid var(--acc);border-radius:var(--r);padding:18px;width:100%;max-width:380px}
.upds{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:12px;animation:ufi .25s ease}
.ulogo{position:relative;width:136px;height:136px;margin-bottom:10px}.ulogo img{position:absolute;inset:16px;width:104px;height:104px;border-radius:24px}
.ulogo .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(232,243,76,.16)}
.ulogo.wait .ring,.ulogo.work .ring{border-top-color:var(--acc);animation:uspin 1s linear infinite}.ulogo.ok .ring{border-color:var(--acc)}.ulogo.late .ring{border-color:var(--warn)}
.ulogo.ok::after{content:'\2713';position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#111;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.utt{font-size:26px;margin:0}.usub{max-width:300px}.ubtn{margin-top:16px;width:100%;max-width:320px}
@keyframes uspin{to{transform:rotate(360deg)}}@keyframes ufi{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
.hidden{display:none}
small.m{color:var(--mute)}
.del{color:var(--bad);border-color:transparent;background:none}
.step{display:flex;align-items:center;gap:6px}.step button{width:40px;padding:0;font-size:20px}.step input{width:70px;text-align:center}
.ring{flex:none}.big small{font-size:18px;font-family:Barlow,sans-serif;letter-spacing:0;display:block;margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 6px;vertical-align:middle}
.mod{font-size:13px;padding:6px 12px;min-height:32px;border-radius:99px;color:var(--acc);border-color:var(--line);background:transparent}
.tr{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1)}
.goal{background:linear-gradient(135deg,#2a2a2d 0%,#25262b 60%,#2c2a1a 100%);border-color:#4a4a3a}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:600}
.goalt{font-family:Montserrat,sans-serif;font-weight:800;font-size:22px;line-height:1.1;margin-top:2px}
.phbar{position:relative;display:flex;gap:3px;height:10px;margin-top:10px}.phbar i{border-radius:99px;opacity:.85}.phbar b{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.cd{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--f);white-space:nowrap}.cd.now{color:var(--acc)}.cd.late{color:var(--warn)}
.burst{position:fixed;left:50%;top:45%;z-index:20;pointer-events:none}.burst i{position:absolute;width:10px;height:10px;border-radius:3px;animation:bu 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bu{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.burstmsg{position:absolute;transform:translate(-50%,-50%);font:800 26px Montserrat,sans-serif;color:var(--acc);white-space:nowrap;animation:bm 1.5s ease forwards}
@keyframes bm{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@media (prefers-reduced-motion:reduce){.tr{transition:none}.burst{display:none}}
.chint{font-size:11.5px;color:var(--c);opacity:.6;margin:1px 0 3px;letter-spacing:.01em}.items .chint{margin:-2px 0 8px;text-align:right}
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando…</p></main>
<nav id="nav">
  <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Semana</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Plan</button>
  <button data-tab="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Datos</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
