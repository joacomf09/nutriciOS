<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriciOS">
<meta name="theme-color" content="#07090b">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>NutriciOS</title>
<style>
:root{--bg:#07090b;--card:#11151a;--ink:#f3f5f7;--mute:#8a939e;--line:#1f262e;--acc:#c8f560;--acc2:#1a2410;--warn:#ffb547;--warn2:#2a2010;--bad:#ff6b6b;--r:16px;--ink-on-acc:#07090b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,-apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1,h2,.big,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.02em}h1{font-size:30px;margin:8px 0 2px;text-transform:uppercase}h2{font-size:15px;margin:22px 0 8px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}h3{font-size:16px;margin:0;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.hi{border-color:var(--acc);background:var(--acc2)}.wn{border-color:var(--warn);background:var(--warn2)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;min-height:40px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--ink-on-acc);font-weight:700}
button.s{padding:6px 10px;min-height:34px;font-size:14px}
button:active{opacity:.7}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
input[type=number]{text-align:right}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 4px}
.meal{display:flex;gap:12px;align-items:flex-start}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;flex:none;font-weight:800;color:var(--ink-on-acc);background:var(--acc)}
.chk.off{background:transparent;color:var(--mute);border-color:var(--line)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--acc);border-color:var(--acc)}.tag.w{color:var(--warn);border-color:var(--warn)}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border-radius:99px;padding:6px 12px;min-height:34px;font-size:14px}.chips button.on{background:var(--acc);color:var(--ink-on-acc);border-color:var(--acc)}
.items .it{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
.hidden{display:none}
small.m{color:var(--mute)}
.del{color:var(--bad);border-color:transparent;background:none}
.step{display:flex;align-items:center;gap:6px}.step button{width:40px;padding:0;font-size:20px}.step input{width:70px;text-align:center}
.ring{flex:none}.big small{font-size:18px;font-family:Barlow,sans-serif;letter-spacing:0;display:block;margin-top:2px}
.mod{font-size:13px;padding:6px 12px;min-height:32px;border-radius:99px;color:var(--acc);border-color:var(--line);background:transparent}
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando…</p></main>
<nav id="nav">
  <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Semana</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Plan</button>
  <button data-tab="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Datos</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
