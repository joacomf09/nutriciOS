<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriciOS">
<meta name="theme-color" content="#1A1A1A">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png">
<title>NutriciOS</title>
<style>
:root{--bg:#1A1A1A;--card:#222220;--ink:#F5F3EE;--mute:#a8a49c;--line:#3a3a38;--acc:#F7D23E;--acc2:#2a2614;--tape:#FF5A1F;--warn:#FF8A4C;--warn2:#33201a;--bad:#ff6b5a;--r:2px;--ink-on-acc:#1A1A1A;--p:#FF5A1F;--c:#F7D23E;--f:#8FC3E8;--kc:#F5F3EE;--navbg:rgba(26,26,26,.96);--disp:'Big Shoulders Display',Impact,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F5F3EE;--card:#FFFFFF;--ink:#1A1A1A;--mute:#5E5A53;--line:#D3CEC4;--acc:#E0B400;--acc2:#FBF3CF;--tape:#FF5A1F;--warn:#C2410C;--warn2:#FDE9DF;--bad:#C62828;--ink-on-acc:#1A1A1A;--p:#E04A10;--c:#C79A00;--f:#2F78B0;--kc:#1A1A1A;--navbg:rgba(245,243,238,.96)}}
:root[data-theme=light]{--bg:#F5F3EE;--card:#FFFFFF;--ink:#1A1A1A;--mute:#5E5A53;--line:#D3CEC4;--acc:#E0B400;--acc2:#FBF3CF;--tape:#FF5A1F;--warn:#C2410C;--warn2:#FDE9DF;--bad:#C62828;--ink-on-acc:#1A1A1A;--p:#E04A10;--c:#C79A00;--f:#2F78B0;--kc:#1A1A1A;--navbg:rgba(245,243,238,.96)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .card.hi b,:root:not([data-theme=dark]) .mod,:root:not([data-theme=dark]) .cd.now{color:var(--ink)}}
:root[data-theme=light] .card.hi b,:root[data-theme=light] .mod,:root[data-theme=light] .cd.now{color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',-apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-family:var(--disp);font-weight:800;font-size:46px;line-height:.95;margin:10px 0 6px;letter-spacing:.01em;text-transform:uppercase}.big,.cond{font-family:var(--disp);letter-spacing:.02em}h2{font-family:var(--mono);font-size:12px;font-weight:500;margin:24px 0 8px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}h3{font-family:var(--disp);font-size:20px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--mute);font-size:12.5px;font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.hi{border:2px solid var(--acc);background:var(--acc2)}.card.hi b{color:var(--acc)}.wn{border-color:var(--warn);background:var(--warn2)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;padding:9px 12px;min-height:44px}
button.p{background:var(--acc);border-color:var(--acc);color:var(--ink-on-acc);font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;border-radius:2px}
button.s{padding:6px 10px;min-height:34px;font-size:14px}
button:active{opacity:.7}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-height:40px;width:100%}
input[type=number]{text-align:right}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 4px}
.meal{display:flex;gap:12px;align-items:flex-start}.meal .row{flex-wrap:wrap;row-gap:6px}
.chk{width:32px;height:32px;border-radius:2px;border:2px solid var(--acc);display:grid;place-items:center;flex:none;font-weight:800;color:var(--ink-on-acc);background:var(--acc)}
.chk.off{background:transparent;color:var(--mute);border-color:var(--line)}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--acc);border-color:var(--acc)}.tag.w{color:var(--warn);border-color:var(--warn)}
.big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:0;background:var(--line);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid var(--line);border-radius:2px;display:flex;padding:6px;max-width:620px;margin:0 auto}
nav button{flex:1;border:0;background:none;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border-radius:2px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
nav button svg{width:24px;height:24px}nav button.on{color:var(--ink-on-acc);font-weight:600;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border-radius:2px;padding:6px 12px;min-height:34px;font-size:14px}.chips button.on{background:var(--acc);color:var(--ink-on-acc);border-color:var(--acc)}
.items .it{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:6px 0}
.items .swipe{position:relative;margin:6px 0;border-radius:2px;overflow:hidden}
.items .swipe .it select{touch-action:pan-y}
.items .swipe .it{margin:0;background:var(--card);position:relative;touch-action:pan-y}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#3a1517;color:var(--bad);opacity:0}
.swbg svg{width:22px;height:22px;transition:transform .15s}.swbg.ready{background:var(--bad);color:#fff}.swbg.ready svg{transform:scale(1.25)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}.mbox{background:var(--card);border:2px solid var(--acc);border-radius:var(--r);padding:18px;width:100%;max-width:380px}
.upds{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:12px;animation:ufi .25s ease}
.ulogo{position:relative;width:136px;height:136px;margin-bottom:10px}.ulogo img{position:absolute;inset:16px;width:104px;height:104px;border-radius:24px}
.ulogo .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(232,243,76,.16)}
.ulogo.wait .ring,.ulogo.work .ring{border-top-color:var(--acc);animation:uspin 1s linear infinite}.ulogo.ok .ring{border-color:var(--acc)}.ulogo.late .ring{border-color:var(--warn)}
.ulogo.ok::after{content:'\2713';position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#111;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.utt{font-size:26px;margin:0}.usub{max-width:300px}.ubtn{margin-top:16px;width:100%;max-width:320px}
@keyframes uspin{to{transform:rotate(360deg)}}@keyframes ufi{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:2px;font-size:14px;z-index:9;max-width:90vw}
.hidden{display:none}
small.m{color:var(--mute)}
.del{color:var(--bad);border-color:transparent;background:none}
.step{display:flex;align-items:center;gap:6px}.step button{width:40px;padding:0;font-size:20px}.step input{width:70px;text-align:center}
.ring{flex:none}.big small{font-size:13px;font-family:var(--mono);letter-spacing:0;display:block;margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 6px;vertical-align:middle}
.mod{flex:none;white-space:nowrap;font-family:var(--mono);font-size:12px;padding:6px 10px;min-height:36px;border-radius:2px;color:var(--acc);border-color:var(--line);background:transparent}
.tr{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1)}
.goal{background:var(--card);border:2px solid var(--ink)}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-on-acc);background:var(--tape);font-weight:600;padding:3px 8px;transform:rotate(-2deg)}
.goalt{font-family:var(--disp);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1.1;margin-top:2px}
.phbar{position:relative;display:flex;gap:3px;height:10px;margin-top:10px}.phbar i{border-radius:0;opacity:.85}.phbar b{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.cd{font-family:var(--mono);display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--f);white-space:nowrap}.cd.now{color:var(--acc)}.cd.late{color:var(--warn)}
.burst{position:fixed;left:50%;top:45%;z-index:20;pointer-events:none}.burst i{position:absolute;width:10px;height:10px;border-radius:3px;animation:bu 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bu{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.burstmsg{position:absolute;transform:translate(-50%,-50%);font:800 34px var(--disp);text-transform:uppercase;color:var(--acc);white-space:nowrap;animation:bm 1.5s ease forwards}
@keyframes bm{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@media (prefers-reduced-motion:reduce){.tr{transition:none}.burst{display:none}}
.chint{font-size:11.5px;color:var(--c);opacity:.6;margin:1px 0 3px;letter-spacing:.01em}.items .chint{margin:-2px 0 8px;text-align:right}
.cs{text-align:center;display:grid;gap:10px;max-height:90vh;overflow:auto}.cs .eyebrow{justify-self:center}
.cst{font:800 34px/1 var(--disp);text-transform:uppercase;margin:0}
.csring{position:relative;width:150px;margin:0 auto}
.csr{stroke-dasharray:var(--C);stroke-dashoffset:var(--C);animation:csdraw 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes csdraw{to{stroke-dashoffset:var(--o)}}
.gstamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--acc);color:var(--ink-on-acc);background:var(--acc);font:800 22px/1 var(--disp);letter-spacing:.08em;padding:6px 12px;border-radius:2px;animation:gst .5s 1.3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes gst{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.csm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.csm div{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 4px}.csm b{display:block;font:800 24px/1 var(--disp)}.csm span{font-size:11px;color:var(--mute)}
.mlist{display:grid;gap:2px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 10px}
.mlist div{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}.mlist b{margin-left:auto;font-family:var(--disp);font-size:18px}
.mlist em{font-style:normal;color:var(--mute);font-size:12px}.mlist .sk{color:var(--mute)}
.ck{width:20px;height:20px;border-radius:2px;background:var(--acc);color:var(--ink-on-acc);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}.ck.x{background:var(--line);color:var(--mute)}
@media (prefers-reduced-motion:reduce){.csr{animation:none;stroke-dashoffset:var(--o)}.gstamp{animation:none}}
.csbk{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando…</p></main>
<nav id="nav">
  <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Semana</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Plan</button>
  <button data-tab="datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Datos</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
